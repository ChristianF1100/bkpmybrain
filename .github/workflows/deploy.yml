name: Pubblica bkpmybrain su GitHub Pages

on:
  push:
    branches: [main]
  # Ricompilazione notturna: pubblica da sola i contenuti con data di pubblicazione futura
  # quando il giorno arriva. Se non ti serve, elimina queste due righe.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa le dipendenze
        # `npm ci` se il lockfile è stato committato, altrimenti `npm install`
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Valida i contenuti
        run: npm run validate

      - name: Test (collegamenti, attività, layout, ricerca…)
        run: npm test

      - name: Genera rete, collegamenti e indice di ricerca
        run: npm run data

      - name: Compila le pagine statiche
        run: npx astro build
        # site e base (sottopercorso /nome-repo o dominio personalizzato) sono dedotti
        # da config/site.json e da GITHUB_REPOSITORY: vedi config/resolve-site.ts

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
